name: EdTech Job Watcher

on:
  schedule:
    - cron: "0 */2 * * *"   # every 2 hours
  workflow_dispatch: {}

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright browsers
        run: python -m playwright install --with-deps chromium

      - name: Run scraper
        env:
          KEYWORDS: "assessment|director|program|project|product|testing|math|science"
          TAG: "edtech"
        run: python scraper.py

      - name: Check if email body exists
        id: emailcheck
        run: |
          if [ -f email_body.md ] && [ -s email_body.md ]; then
            echo "has_email=true" >> $GITHUB_OUTPUT
          else
            echo "has_email=false" >> $GITHUB_OUTPUT
          fi

      - name: Send email notification
        if: steps.emailcheck.outputs.has_email == 'true'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_SERVER }}
          server_port: ${{ secrets.SMTP_PORT }}
          username:
